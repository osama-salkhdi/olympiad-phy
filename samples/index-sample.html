<h2>نموذج لصيغة ملف الاختبار (ثلاثة أسئلة)</h2>
<p>هذا الملف للتجربة فقط: استورده من لوحة التحكم ← الاختبارات ← «استيراد ملف اختبار (HTML)».</p>
<script>
/* القواعد: o من 2 إلى 5 خيارات — a رقم الإجابة الصحيحة يبدأ من 0 — المعادلات بين $ $ مع شرطتين مائلتين \\ داخل القوالب */

  { q: `ما قيمة التعبير $\\dfrac{3}{4} + \\dfrac{1}{4}$ ؟`,
    o: ['$1$', '$\\dfrac{1}{2}$', '$\\dfrac{3}{8}$', '$2$'],
